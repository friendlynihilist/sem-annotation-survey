    <button id="savebar">Download SVG</button>
  </section>
  <section id="pieChartSection">
    <h2>Tool vs. Time</h2>
    <div id="pieChart"></div>
    <button id="savepie">Download SVG</button>
  </section>
  <section id="sankeyChartSection">
    <h2>Tool vs. Time</h2>
    <div id="sankeyChart"></div>
    <button id="savesankey">Download SVG</button>
  </section>
  <section id="heatMapSection">
    <h2>Tool vs. Time</h2>
    <div id="heatmapChart"></div>
    <button id="saveheatmap">Download SVG</button>
  </section>
  <section id="sankeyChart2Section">
    <h2>Tool vs. Time</h2>
    <div id="sankeyChart2"></div>
    <button id="savesankey2">Download SVG</button>
  </section>
  <section id="timelineChartSection">
    <!-- <h2>Tool vs. Time</h2>
      <div id="timelineChart"></div>
      <button id="savetimeline">Download SVG</button> -->
    <h2>Tool vs. Time</h2>
    <svg id="tool-time" width="1000" height="300"></svg>
    <div id="tool-legend" class="legend"></div>

    <h2>Metadata vs. Time</h2>
    <svg id="metadata-time" width="1000" height="300"></svg>
    <div id="metadata-legend" class="legend"></div>

    <h2>Ontology vs. Time</h2>
    <svg id="ontology-time" width="1000" height="300"></svg>
    <div id="ontology-legend" class="legend"></div>
    <button id="savetimeline">Download SVG</button>

</div>
